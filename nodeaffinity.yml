apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpression:
          - key: type
            operator: In 
            values:
            - backend
  containers:
  - name: nginx-containers
    image: nginx:latest
    ports:
    - containerPort: 80               